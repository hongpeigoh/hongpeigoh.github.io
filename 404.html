<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hong Pei's Website</title>
    <!-- Redirect -->
    <script type="text/javascript">
      (() => {
        const { pathname, search, hash } = window.location;
        if (hash.startsWith('#/') || pathname === '/' || pathname === '/index.html') return;
        window.location.replace(`/#${pathname}${search}${hash}`);
      })();
    </script>
  </head>
  <body>
  </body>
</html>
